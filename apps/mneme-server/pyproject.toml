[project]
name = "mneme-server"
version = "0.1.0"
description = "FastAPI server for mneme-memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mneme-core",
    "mneme-plugins",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "structlog>=24.0",
]

[project.scripts]
mneme-server = "mneme_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme_server"]
