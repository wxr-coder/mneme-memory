[project]
name = "mneme-cli"
version = "0.1.0"
description = "CLI tool for mneme-memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mneme-core",
    "mneme-plugins",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
mneme = "mneme_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme_cli"]
