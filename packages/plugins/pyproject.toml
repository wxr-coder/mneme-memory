[project]
name = "mneme-plugins"
version = "0.1.0"
description = "Plugin interfaces and built-in implementations for mneme-memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mneme-core",
    "numpy>=1.24",
]

[project.optional-dependencies]
transformers = ["sentence-transformers>=3.0", "torch>=2.0"]
postgres = ["asyncpg>=0.30", "pgvector>=0.3"]
bm25 = ["rank-bm25>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme_plugins"]
