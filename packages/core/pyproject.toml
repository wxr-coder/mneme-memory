[project]
name = "mneme-core"
version = "0.1.0"
description = "Core models, capability detection, and config for mneme-memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "structlog>=24.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "pgvector>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme_core"]
