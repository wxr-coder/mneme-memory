[project]
name = "mneme"
version = "0.1.0"
description = "mneme-memory SDK — human-like memory for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mneme-core",
    "mneme-plugins",
    "mneme-engine",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
server = ["mneme-server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme"]
