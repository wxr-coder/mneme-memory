[project]
name = "mneme-engine"
version = "0.1.0"
description = "Memory engine: recall, reflection, consolidation, and personality evolution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mneme-core",
    "mneme-plugins",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme_engine"]
