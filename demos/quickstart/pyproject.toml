[project]
name = "mneme-quickstart"
version = "0.1.0"
description = "Minimal demo for mneme-memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mneme-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mneme_quickstart"]
