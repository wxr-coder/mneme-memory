[project]
name = "mneme-memory"
version = "0.1.0"
description = "Human-like memory system for AI agents — reconstruction, not just access"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
package = false

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
]

[tool.uv]
managed = true
package = false

[tool.uv.sources]
mneme-core = { workspace = true }
mneme-plugins = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/plugins",
    "apps/mneme-server",
    "apps/mneme-cli",
    "demos/quickstart",
]

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "TID"]
ignore = ["E501", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["mneme_core", "mneme_plugins", "mneme_server", "mneme_cli"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["apps", "packages", "demos"]
addopts = "--import-mode=importlib"
markers = [
    "live_llm: tests that hit real LLM/http endpoints and are skipped by default",
]
